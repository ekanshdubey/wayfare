<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf6f1"><title>Wayfare — AI Trip Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--paper:#faf6f1;--ink:#20201f;--muted:#898780;--coral:#ff5a4e;--green:#2e9e8f;--line:#eee8e1;--card:#fff;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:480px;min-height:100vh;margin:auto;padding:0 18px 105px}.top{display:flex;align-items:center;justify-content:space-between;padding:23px 0 20px}.brand{font-weight:900;font-size:27px;letter-spacing:-1.3px}.brand span{color:var(--coral)}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.plane{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:20px}.heading{font-size:22px;letter-spacing:-.6px;font-weight:850;margin:10px 0 5px}.subheading{color:var(--muted);font-size:13px;margin:0 0 18px}.tabs{display:flex;gap:6px;padding:5px;background:#eee9e2;border-radius:15px;margin-bottom:19px}.tab{border:0;background:transparent;flex:1;padding:10px 7px;border-radius:11px;font-size:13px;font-weight:750;color:#77746e}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px #2a21140d}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;background:var(--ink);color:#fff}.btn.coral{background:var(--coral)}.btn.light{background:#f2eee8;color:var(--ink)}.btn.small{font-size:12px;padding:8px 10px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.field{width:100%;border:1px solid #e8e2da;border-radius:12px;background:#fff;padding:12px;color:var(--ink);outline:none}.field:focus{border-color:var(--coral);box-shadow:0 0 0 3px #ff5a4e18}.form{display:grid;gap:9px;margin-bottom:16px}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 11px;white-space:nowrap;font-size:12px;font-weight:700;color:#706d67}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.card{background:var(--card);border:1px solid #f0ebe5;border-radius:var(--radius);padding:15px;margin-bottom:10px;box-shadow:0 3px 12px #30241605}.spot{display:flex;gap:12px;align-items:flex-start}.emoji{width:45px;height:45px;flex-shrink:0;display:grid;place-items:center;border-radius:14px;background:#fff0e9;font-size:23px}.spot h3{font-size:15px;margin:1px 0 3px;line-height:1.25}.meta{font-size:12px;color:var(--muted)}.note{font-size:12px;color:#716d67;margin-top:6px}.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:4px 6px;background:#f3f0eb;color:#6e6a64;margin-top:7px}.iconbtn{border:0;background:transparent;color:#aaa49a;font-size:18px;padding:4px}.empty{text-align:center;border:1px dashed #ddd4ca;border-radius:18px;padding:28px 18px;color:var(--muted);background:#ffffff60}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #eee9e3;padding:8px 14px calc(8px + env(safe-area-inset-bottom));z-index:100}.bottominner{max-width:450px;margin:auto;display:flex}.nav{flex:1;border:0;background:transparent;color:#a19b92;display:grid;justify-items:center;gap:3px;padding:2px;font-size:10px;font-weight:800}.nav .navicon{height:34px;width:58px;border-radius:99px;display:grid;place-items:center;font-size:19px}.nav.active{color:var(--ink)}.nav.active .navicon{background:var(--ink);color:#fff}.nav.active[data-tab=import] .navicon{background:var(--coral)}.hero{padding:17px;border-radius:20px;background:#252522;color:#fff;margin-bottom:15px;position:relative;overflow:hidden}.hero:after{content:"✈";position:absolute;right:14px;top:9px;font-size:56px;opacity:.13;transform:rotate(-12deg)}.hero small{color:#c4c1ba;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}.hero h2{font-size:20px;margin:7px 0 5px;max-width:260px;letter-spacing:-.5px}.hero p{font-size:12px;color:#c9c5be;margin:0;max-width:265px}.map{height:210px;border-radius:16px;overflow:hidden;margin-bottom:13px;background:#e9e5dd}.mapnote{font-size:11px;color:var(--muted);margin:-4px 0 13px}.sectionlabel{font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:850;color:#9a948a;margin:20px 0 9px}.routeitem{display:flex;gap:12px;position:relative;padding-bottom:13px}.routeitem:not(:last-child):before{content:"";position:absolute;left:17px;top:35px;bottom:0;width:2px;background:#e8e0d7}.number{height:35px;width:35px;border-radius:12px;background:#fff0e9;color:var(--coral);display:grid;place-items:center;font-weight:900;z-index:1}.routecontent{flex:1;padding-top:1px}.routecontent strong{display:block;font-size:14px}.routecontent small{color:var(--muted);font-size:12px}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#242421;color:#fff;padding:10px 15px;border-radius:12px;font-size:13px;z-index:200;box-shadow:0 8px 30px #0002;display:none}.hide{display:none!important}.footerhint{text-align:center;font-size:11px;color:#a19b92;margin-top:18px}@media(min-width:700px){
body{padding:0;background:#f2ede6}
.shell{max-width:none;width:100%;margin:0;padding:0 clamp(28px,4vw,76px) 100px;background:var(--paper);border-radius:0;box-shadow:none;min-height:100vh}
.top{padding:30px 0 26px}.brand{font-size:34px}.subtitle{font-size:15px}
.hero{padding:32px 36px;border-radius:24px;margin-bottom:22px}.hero h2{font-size:32px;max-width:720px}.hero p{font-size:15px;max-width:720px}.hero:after{font-size:110px;right:42px;top:0}
.tabs{max-width:none;width:100%;margin-bottom:30px}.tab{padding:14px 16px;font-size:15px}
.heading{font-size:30px}.subheading{font-size:15px}.field{padding:15px 16px;font-size:16px}
.card{padding:22px;margin-bottom:16px}.spot h3{font-size:18px}.meta,.note{font-size:14px}.emoji{width:54px;height:54px;font-size:26px}
.map{height:360px}.mapnote{font-size:12px}.filters{flex-wrap:wrap}.chip{font-size:13px;padding:9px 14px}
#view{max-width:none;width:100%}
#view>.card,#view>.empty{max-width:none}
.bottom{bottom:18px;left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100% - 40px));border:1px solid #eee9e3;border-radius:20px;box-shadow:0 8px 30px #32231414;padding:8px 14px}
.bottominner{max-width:none}
}
@media(min-width:1000px){
.shell{padding-left:clamp(48px,5vw,100px);padding-right:clamp(48px,5vw,100px)}
.hero{padding:38px 44px}
#view .map{height:400px}
#view>.card.spot{display:inline-flex;vertical-align:top;width:calc(50% - 10px);margin-right:16px;min-height:130px}
#view>.card.spot:nth-of-type(2n){margin-right:0}
}
@media(max-width:699px){.shell{max-width:480px}.bottom{left:0;right:0;width:100%;transform:none;border-radius:0}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div><div class="brand">Wayfare<span>.</span></div><div class="subtitle" id="tagline">You save the spots. We handle the rest.</div></div><div class="plane">✈️</div></header>
<div class="hero"><small>Your next adventure, organized</small><h2>Collect places. Build better trips.</h2><p>Save the places you love, turn links into spots, and plan your days around them.</p></div>
<div class="tabs"><button class="tab active" data-tab="spots">◎ &nbsp;Spots</button><button class="tab" data-tab="import">＋ &nbsp;Import</button><button class="tab" data-tab="trips">▤ &nbsp;Trips</button></div>
<main id="view"></main>
<div class="footerhint">Your saved places stay on this device.</div>
</div>
<nav class="bottom"><div class="bottominner"><button class="nav active" data-tab="spots"><span class="navicon">⌖</span>Spots</button><button class="nav" data-tab="import"><span class="navicon">＋</span>Import</button><button class="nav" data-tab="trips"><span class="navicon">▤</span>Trips</button></div></nav>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const initialSpots=[
{id:'s1',name:'Senso-ji Temple',category:'Sight',city:'Tokyo',emoji:'⛩️',note:'Go early for a quieter visit',source:'Saved place',lat:35.7148,lng:139.7967},
{id:'s2',name:'Tsukiji Outer Market',category:'Food',city:'Tokyo',emoji:'🍣',note:'Fresh seafood and street snacks',source:'Saved place',lat:35.6654,lng:139.7707},
{id:'s3',name:'Coffee at Koffee Mameya',category:'Cafe',city:'Tokyo',emoji:'☕',note:'Specialty coffee stop',source:'Saved place',lat:35.6655,lng:139.6988},
{id:'s4',name:'Shibuya Sky',category:'Sight',city:'Tokyo',emoji:'🌇',note:'Book a sunset time slot',source:'Saved place',lat:35.6585,lng:139.7013},
{id:'s5',name:'Nishiki Market',category:'Food',city:'Kyoto',emoji:'🍡',note:'A little bit of everything',source:'Saved place',lat:35.005,lng:135.7648},
{id:'s6',name:'Fushimi Inari Taisha',category:'Sight',city:'Kyoto',emoji:'⛩️',note:'Walk up through the red torii gates',source:'Saved place',lat:34.9671,lng:135.7727}
];
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem('wayfare-'+k))||f}catch{return f}};
let spots=load('spots',initialSpots),trips=load('trips',[]),tab='spots',filter='All',search='',showAdd=false,map=null,aiItinerary=load('ai-itinerary',null),aiBusy=false,apiBaseUrl=load('api-url','');
const save=()=>{localStorage.setItem('wayfare-spots',JSON.stringify(spots));localStorage.setItem('wayfare-trips',JSON.stringify(trips))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emojiFor=c=>({'Food':'🍜','Cafe':'☕','Sight':'📍','Shop':'🛍️','Nature':'🌿','Nightlife':'🌙','Hotel':'🛏️','Museum':'🏛️'}[c]||'📍');
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function switchTab(t){tab=t;showAdd=false;document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));document.getElementById('tagline').textContent=({spots:'You save the spots. We handle the rest.',import:'Turn saved posts into real trips',trips:'Day-by-day, route-optimized'})[t];render()}
function render(){map?.remove();map=null;const root=document.getElementById('view');if(tab==='spots')root.innerHTML=spotsView();if(tab==='import')root.innerHTML=importView();if(tab==='trips')root.innerHTML=tripsView();if(tab==='spots')initMap()}
function spotsView(){const cities=['All',...new Set(spots.map(s=>s.city))],cats=['All','Food','Cafe','Sight','Shop','Nature','Nightlife'];const list=spots.filter(s=>(filter==='All'||s.city===filter||s.category===filter)&&(s.name+' '+s.city+' '+s.category).toLowerCase().includes(search.toLowerCase()));return `
<div class="row between"><div><h1 class="heading">Your spots</h1><p class="subheading">${spots.length} places worth remembering</p></div><button class="btn coral" id="addToggle">＋ Add spot</button></div>
<div class="row" style="margin-bottom:12px"><input id="search" class="field" placeholder="Search places or cities…" value="${esc(search)}"></div>
<div class="filters">${cats.map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}${cities.filter(c=>c!=='All').map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div>
${showAdd?addForm():''}
<div class="map" id="map"></div><p class="mapnote">Map preview of saved spots. Zoom and tap a pin for details.</p>
${list.length?list.map(s=>spotCard(s)).join(''):'<div class="empty"><strong>No spots found yet</strong>Add a place or import a saved link to get started.</div>'}
`;}
function spotCard(s){return `<article class="card spot"><div class="emoji">${s.emoji||emojiFor(s.category)}</div><div style="flex:1;min-width:0"><div class="row between" style="align-items:flex-start;gap:4px"><h3>${esc(s.name)}</h3><button class="iconbtn" title="Delete spot" data-delete="${s.id}">×</button></div><div class="meta">${esc(s.city)} · ${esc(s.category)}</div>${s.note?`<div class="note">${esc(s.note)}</div>`:''}<span class="tag">${esc(s.source||'Saved place')}</span></div></article>`}
function addForm(){return `<form class="card form" id="addForm"><h3 style="margin:0 0 3px">Add a spot</h3><input class="field" name="name" placeholder="Place name" required><div class="row"><input class="field" name="city" placeholder="City" required><select class="field" name="category"><option>Food</option><option>Cafe</option><option selected>Sight</option><option>Shop</option><option>Nature</option><option>Nightlife</option><option>Hotel</option><option>Museum</option></select></div><input class="field" name="note" placeholder="A note (optional)"><div class="row"><button class="btn coral" type="submit">Save spot</button><button class="btn light" type="button" id="cancelAdd">Cancel</button></div></form>`}
function importView(){return `<h1 class="heading">Import a place</h1><p class="subheading">Turn a saved post, video, or map link into a spot in your collection.</p><div class="card"><div class="emoji" style="margin-bottom:12px">🔗</div><h3 style="margin:0 0 5px">Paste a link or write a place</h3><p class="meta" style="margin:0 0 15px">Add the URL from Instagram, TikTok, Google Maps, or any website. This browser-only version saves the link and details you enter; it doesn't scrape private social posts.</p><form class="form" id="importForm"><input class="field" name="url" type="url" placeholder="https://…" ><input class="field" name="name" placeholder="Place name (required)" required><div class="row"><input class="field" name="city" placeholder="City" required><select class="field" name="category"><option>Food</option><option>Cafe</option><option selected>Sight</option><option>Shop</option><option>Nature</option><option>Nightlife</option><option>Hotel</option><option>Museum</option></select></div><textarea class="field" name="note" rows="3" placeholder="What did you want to remember?"></textarea><button class="btn coral" type="submit">＋ Save to my spots</button></form></div><div class="card"><strong>💡 Tip</strong><p class="meta">Save the place name and city alongside the link so you can find it later and include it in an itinerary.</p></div>`}
function tripsView(){return `
<div class="row between"><div><h1 class="heading">AI trip builder</h1><p class="subheading">Tell Gemini what kind of trip you want. Wayfare will build a day-by-day plan.</p></div></div>
<div class="card"><div class="row" style="gap:10px;margin-bottom:8px"><div class="emoji">✦</div><div><strong>Plan a trip with AI</strong><div class="meta">Powered by Google Gemini when the backend is connected</div></div></div>
<form id="aiTripForm" class="form">
<label class="meta">Destination</label><input class="field" name="destination" placeholder="e.g. Prague, Vienna and Budapest" required>
<div class="row"><div style="flex:1;min-width:0"><label class="meta">Start date</label><input class="field" name="startDate" type="date" required></div><div style="flex:1;min-width:0"><label class="meta">End date</label><input class="field" name="endDate" type="date" required></div></div>
<div class="row"><div style="flex:1;min-width:0"><label class="meta">Budget</label><select class="field" name="budget"><option value="budget">Budget-friendly</option><option value="moderate" selected>Moderate</option><option value="comfortable">Comfortable</option><option value="luxury">Luxury</option></select></div><div style="flex:1;min-width:0"><label class="meta">Travellers</label><select class="field" name="travelers"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5+</option></select></div></div>
<label class="meta">Interests</label><input class="field" name="interests" placeholder="Food, history, markets, nature, museums…">
<label class="meta">Travel pace</label><select class="field" name="pace"><option value="relaxed">Relaxed</option><option value="balanced" selected>Balanced</option><option value="packed">See as much as possible</option></select>
<label class="meta">Anything else? (optional)</label><textarea class="field" name="notes" rows="3" placeholder="Train travel, accessibility needs, must-see places…"></textarea>
<button class="btn coral" type="submit" ${aiBusy?'disabled':''}>${aiBusy?'Building your trip…':'✦ Generate AI itinerary'}</button>
</form>
<div class="meta">Your Gemini API key stays on the backend and must never be added to this website.</div></div>
<div class="card"><div class="row between"><div><strong>Connect the AI backend</strong><div class="meta">Enter your deployed Cloudflare Worker URL once.</div></div><span class="tag">${apiBaseUrl?'Configured':'Setup needed'}</span></div><form id="apiUrlForm" class="form" style="margin-top:12px"><input class="field" name="apiUrl" type="url" placeholder="https://your-worker.your-subdomain.workers.dev" value="${esc(apiBaseUrl)}" required><button class="btn light" type="submit">Save backend URL</button></form></div>
${aiItinerary?renderAIItinerary(aiItinerary):''}
<div class="sectionlabel">YOUR SAVED TRIPS</div>
<div class="card"><h3 style="margin:0 0 12px">Quick itinerary from saved spots</h3><form id="tripForm" class="form"><input class="field" name="name" placeholder="Trip name" required><div class="row"><input class="field" name="city" placeholder="City" required><select class="field" name="days"><option value="1">1 day</option><option value="2">2 days</option><option value="3" selected>3 days</option><option value="4">4 days</option><option value="5">5 days</option><option value="7">7 days</option></select></div><button class="btn light" type="submit">Build from my saved spots</button></form></div>
${trips.length?trips.map((t,i)=>`<article class="card"><div class="row between"><div><h3 style="margin:0 0 4px">${esc(t.name)}</h3><div class="meta">${esc(t.city)} · ${t.days} day${t.days===1?'':'s'} · ${t.itinerary.reduce((n,d)=>n+d.stops.length,0)} stops</div></div><button class="iconbtn" data-trip-delete="${i}">×</button></div><div class="sectionlabel">ITINERARY</div>${t.itinerary.map(d=>`<div class="sectionlabel">DAY ${d.day} · ${esc(t.city)}</div>${d.stops.length?d.stops.map((s,j)=>`<div class="routeitem"><div class="number">${j+1}</div><div class="routecontent"><strong>${esc(s.name)}</strong><small>${esc(s.category)} · ${s.time}</small></div></div>`).join(''):'<p class="meta">Free day — add more spots to fill this day.</p>'}`).join('')}</article>` ).join(''):'<div class="empty"><strong>No saved trips yet</strong>Your AI-generated and saved plans will appear here.</div>'}
`;}
function renderAIItinerary(t){return `<div class="card"><div class="row between"><div><span class="tag">GEMINI AI ITINERARY</span><h2 class="heading" style="margin-top:10px">${esc(t.tripTitle||t.destination||'Your trip')}</h2><p class="subheading">${esc(t.summary||'Your plan, generated with AI.')}</p></div></div>${t.estimatedBudget?`<div class="note">Estimated budget: ${esc(t.estimatedBudget)}</div>`:''}${(t.days||[]).map(d=>`<div class="sectionlabel">DAY ${esc(d.day)} ${d.date?'· '+esc(d.date):''}</div><h3 style="margin:0 0 12px">${esc(d.title||'Explore')}</h3>${(d.activities||[]).map((a,i)=>`<div class="routeitem"><div class="number">${i+1}</div><div class="routecontent"><strong>${esc(a.time||'')} ${esc(a.name||'Activity')}</strong><small>${esc([a.category,a.area].filter(Boolean).join(' · '))}</small>${a.description?`<div class="note">${esc(a.description)}</div>`:''}${a.estimatedCost?`<div class="meta">Cost: ${esc(a.estimatedCost)}</div>`:''}${a.travelTip?`<div class="note">Tip: ${esc(a.travelTip)}</div>`:''}</div></div>`).join('')}`).join('')}${(t.practicalTips||[]).length?`<div class="sectionlabel">PRACTICAL TIPS</div><ul>${t.practicalTips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${(t.assumptions||[]).length?`<div class="note">Assumptions: ${t.assumptions.map(esc).join(' · ')}</div>`:''}<form id="reviseAIForm" class="form" style="margin-top:18px"><label class="meta">Ask AI to change this itinerary</label><textarea class="field" name="request" rows="2" placeholder="Make day 2 cheaper, add a chocolate factory, reduce walking…" required></textarea><button class="btn coral" type="submit" ${aiBusy?'disabled':''}>${aiBusy?'Updating…':'Revise with AI'}</button></form><button class="btn light" id="saveAITrip" type="button">Save this trip</button></div>`;}
function initMap(){const el=document.getElementById('map');if(!el||!window.L)return;const shown=spots.filter(s=>(filter==='All'||s.city===filter||s.category===filter)&&(s.name+' '+s.city+' '+s.category).toLowerCase().includes(search.toLowerCase())&&Number.isFinite(s.lat)&&Number.isFinite(s.lng));map=L.map(el,{scrollWheelZoom:false}).setView(shown.length?[shown[0].lat,shown[0].lng]:[35.68,139.7],shown.length?12:2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);shown.forEach(s=>L.marker([s.lat,s.lng]).addTo(map).bindPopup('<b>'+esc(s.name)+'</b><br>'+esc(s.city)+' · '+esc(s.category)));if(shown.length>1)map.fitBounds(shown.map(s=>[s.lat,s.lng]),{padding:[20,20]})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){switchTab(t.dataset.tab);return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const d=e.target.closest('[data-delete]');if(d){spots=spots.filter(s=>s.id!==d.dataset.delete);save();render();toast('Spot removed');return}const td=e.target.closest('[data-trip-delete]');if(td){trips.splice(Number(td.dataset.tripDelete),1);save();render();toast('Trip deleted');return}if(e.target.id==='addToggle'){showAdd=!showAdd;render()}if(e.target.id==='cancelAdd'){showAdd=false;render()}if(e.target.id==='saveAITrip'&&aiItinerary){trips.unshift({name:aiItinerary.tripTitle||aiItinerary.destination||'AI trip',city:aiItinerary.destination||'',days:(aiItinerary.days||[]).length,itinerary:(aiItinerary.days||[]).map(d=>({day:d.day,stops:(d.activities||[]).map(a=>({name:a.name,category:a.category,time:a.time}))}))});save();toast('AI trip saved');render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);if(e.target.id==='apiUrlForm'){apiBaseUrl=String(fd.get('apiUrl')||'').trim().replace(/\/$/,'');localStorage.setItem('wayfare-api-url',JSON.stringify(apiBaseUrl));render();toast('Backend URL saved');return}if(e.target.id==='aiTripForm'){if(!apiBaseUrl){toast('First save your deployed Gemini backend URL');return}const startDate=String(fd.get('startDate')||''),endDate=String(fd.get('endDate')||'');if(startDate&&endDate&&endDate<startDate){toast('End date must be after start date');return}aiBusy=true;render();try{const response=await fetch(apiBaseUrl+'/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(fd.entries()))});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI request failed');aiItinerary=data.itinerary;localStorage.setItem('wayfare-ai-itinerary',JSON.stringify(aiItinerary));toast('Your AI itinerary is ready')}catch(err){toast(err.message||'Could not reach AI backend')}finally{aiBusy=false;render()}return}if(e.target.id==='reviseAIForm'){if(!apiBaseUrl||!aiItinerary){toast('AI backend or itinerary is missing');return}aiBusy=true;render();try{const response=await fetch(apiBaseUrl+'/api/revise',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:String(fd.get('request')||''),itinerary:aiItinerary})});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI revision failed');aiItinerary=data.itinerary;localStorage.setItem('wayfare-ai-itinerary',JSON.stringify(aiItinerary));toast('Itinerary updated')}catch(err){toast(err.message||'Could not revise itinerary')}finally{aiBusy=false;render()}return}if(e.target.id==='addForm'||e.target.id==='importForm'){const url=String(fd.get('url')||'');const name=String(fd.get('name')||'').trim();const city=String(fd.get('city')||'').trim();if(!name||!city)return;const spot={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,city,category:String(fd.get('category')||'Sight'),emoji:emojiFor(String(fd.get('category')||'Sight')),note:String(fd.get('note')||'').trim(),source:url?'Imported link':'Manual',url,lat:NaN,lng:NaN};spots.unshift(spot);save();tab='spots';filter='All';search='';showAdd=false;switchTab('spots');toast('Spot saved to your collection');return}if(e.target.id==='tripForm'){const name=String(fd.get('name')||'').trim(),city=String(fd.get('city')||'').trim(),days=Number(fd.get('days')||3);const citySpots=spots.filter(s=>s.city.toLowerCase()===city.toLowerCase());const itinerary=Array.from({length:days},(_,i)=>({day:i+1,stops:citySpots.filter((s,j)=>j%days===i).map((s,j)=>({...s,time:['09:00','11:30','14:00','16:30','19:00'][j%5]}))}));trips.unshift({name,city,days,itinerary});save();render();toast('Trip saved')}if(e.target.id==='saveAITrip'){if(aiItinerary){trips.unshift({name:aiItinerary.tripTitle||aiItinerary.destination||'AI trip',city:aiItinerary.destination||'',days:(aiItinerary.days||[]).length,itinerary:(aiItinerary.days||[]).map(d=>({day:d.day,stops:(d.activities||[]).map(a=>({name:a.name,category:a.category,time:a.time}))}))});save();toast('AI trip saved');render()}}});render();
</script>
</body></html>
